[workspace]
resolver = "3"
members = ["crates/pagedllm", "crates/pagedllm-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/nicoNaeg/paged-llm-rs"
authors = ["Nicolas Naegelen"]

[workspace.dependencies]
candle-core = "0.11.0"

[workspace.lints.rust]
missing_docs = "warn"
# A module that needs unsafe opts out explicitly, with a justification and a
# test that exercises what the compiler stopped checking.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Fire on nearly every public item and buy nothing on an application crate.
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Every cast this fires on is a tensor dimension or a token position, bounded by
# what fits in memory and so far below the 53 bits an f64 carries exactly.
cast_precision_loss = "allow"

[profile.release]
# Profiles are taken on release builds and need symbols to resolve.
debug = true
lto = "thin"
codegen-units = 1
