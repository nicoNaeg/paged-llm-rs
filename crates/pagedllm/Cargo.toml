[package]
name = "pagedllm"
description = "LLM inference engine: paged KV cache, continuous batching, hand-written attention kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
candle-core = { workspace = true }
candle-metal-kernels = { version = "0.11.0", optional = true }
half = "2.7.1"
minijinja = { version = "2.21.0", features = ["json"] }
minijinja-contrib = { version = "2.21.0", features = ["pycompat"] }
objc2-metal = { version = "0.3.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[features]
# The Apple GPU path. Off by default so the crate builds and tests on any
# machine, which is what CI runs: GitHub's macOS runners have no Metal device.
metal = ["candle-core/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]
# The NVIDIA path. Compiled and checked on an RTX 4090, against the same scalar
# reference the Metal path is checked against; `docs/cuda-port.md` carries the
# numbers and what porting it said about the Metal one.
cuda = ["candle-core/cuda"]

[lints]
workspace = true
