[package]
name = "pagedllm-server"
description = "OpenAI-compatible HTTP server for the pagedllm engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
pagedllm = { path = "../pagedllm" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "signal", "sync"] }

[features]
metal = ["pagedllm/metal"]
cuda = ["pagedllm/cuda"]

[lints]
workspace = true
