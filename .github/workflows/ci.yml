name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded pull request run is wasted work. A superseded push to main is
# not: every commit that lands there is meant to have been checked, so those run
# to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # These two read text and cost a second, so they come before the build
      # rather than behind it. The benchmarks and the mutation run are not
      # exercised here: they need a checkpoint, a GPU, or twenty minutes. A
      # syntax error in one of them is still invisible until somebody runs it.
      - run: python3 -m compileall -q scripts
      # Every mutation is a literal excerpt of the source, so a refactor that
      # moves the line leaves the mutation matching nothing. `make mutate`
      # reports that as a failure, but only when it is run. This says it in a
      # second, on every push.
      - run: python3 scripts/check-mutations.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --nocapture so the full-scale comparison's skip reaches the log. It has
      # no checkpoint to run against here and says so; captured, it would look
      # like a test that ran.
      - run: cargo test --workspace -- --nocapture

  metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # A separate cache: this job resolves a different feature set from the
          # one above, and sharing a cache would thrash both.
          key: metal
      # Compiles the Metal path and stops there. MTLCreateSystemDefaultDevice
      # returns nil inside a hosted macOS runner, so nothing here can dispatch a
      # kernel. Kernels are checked against their CPU reference in the job above
      # and on real hardware with `make test-metal`.
      - run: cargo clippy --workspace --all-targets --features metal -- -D warnings

  # `rust-version` is a promise, and a job on `stable` only ever proves that
  # stable is new enough. This builds on exactly the version the manifest names,
  # read from the manifest so the two cannot drift, and on both platforms: the
  # binding constraint today is candle's NEON path, which only Apple silicon
  # compiles, and a dependency could raise the other side tomorrow.
  msrv:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          # With the feature the promise covers what people actually build here,
          # and without it the job would only ever have checked the path this
          # project exists to replace.
          - os: macos-latest
            features: "--features metal"
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.os }}
      # Checking rather than testing: what this answers is whether the declared
      # version compiles the workspace, and running the suite twice on two
      # toolchains would pay for an answer the job above already gives.
      - run: cargo check --workspace --all-targets ${{ matrix.features }}
